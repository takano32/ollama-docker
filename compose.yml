# 箱に1台の共有の埋め込みサーバー。2026-10-30 から ollama をやめ、llama.cpp 公式のサーバーイメージ（ghcr.io/ggml-org/llama.cpp:server-bNNNNN）で
# bge-m3 を直接動かす（ollama serve が子に llama-server を立てて ps に llama-server と出るのが不自然、という takano32 の指摘から）。
# ほかの compose プロジェクトは external network `ollama` に参加して、ホスト名 `ollama`（network alias）の 11434 番に繋ぐ
# （OpenAI 互換の口は http://ollama:11434/v1、埋め込みは /v1/embeddings。model 欄は何を書いても bge-m3 が答える）。
# ホスト側からは 127.0.0.1:11434 だけ（外には開けない）。プロジェクト名・network 名・ボリューム名は ollama 時代のまま（向こうから何も変えないため）。
#
# 戻し方（ollama に戻す）: 下の ollama と mcp は profile `ollama` に退避してあり、イメージ（ollama/ollama:0.40.5）もボリューム ollama_models も残っている。
#   docker compose stop embed && docker compose rm -f embed
#   docker compose --profile ollama up -d ollama mcp
# （ollama と embed は同じホスト名 `ollama`・同じポート 11434 を取り合うので、同時には上げない）
name: ollama

services:
  # bge-m3 の埋め込み。実行ファイル llama-server に用途の名前の symlink（/app/bge-m3-embed）を張ってそれで起動するので、
  # ps と /proc/<pid>/comm には bge-m3-embed と出る（2026-10-30 に確かめた）。
  embed:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_VERSION:-server-b12004}   # arm64 あり。2026-10-30 の版（build 12004、commit 3c809f443）
    container_name: bge-m3-embed
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      default:
        aliases: [ollama]   # 使う側（hindsight-docker、honcho-docker）が見ているホスト名
    volumes:
      # 重みは ollama が落とした bge-m3 の blob をそのまま読む（読み取り専用。コピーしない＝ollama のときと同じ重みであることを保証する）
      - models:/models:ro
    entrypoint: ["/bin/sh", "-c", "ln -sf llama-server /app/bge-m3-embed && exec /app/bge-m3-embed \"$@\"", "--"]
    # 引数は ollama 0.40.5 が bge-m3 に立てていた llama-server の起動（docker top で見たもの）に合わせた。
    # ollama 固有のもの（--load-mode none、--log-verbosity、--no-log-prefix 等）と、埋め込みでは効かない --context-shift --keep は落とした。
    # --alias bge-m3: /v1/models と応答の model 欄の名前
    command:
      - --model
      - /models/models/blobs/sha256-daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c   # bge-m3:latest（ollama の ID 790764642607）
      - --alias
      - bge-m3
      - --host
      - 0.0.0.0
      - --port
      - "11434"
      - --no-webui
      - --offline
      - --embedding
      - -c
      - "4096"
      - -np
      - "1"
      - -b
      - "2048"
      - -ub
      - "2048"
      - --flash-attn
      - auto
    healthcheck:
      # イメージの既定は localhost:8080 を見るので、ポートに合わせて上書き
      test: ["CMD", "curl", "-f", "http://localhost:11434/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 箱のほかのサービスを守る安全弁。待機の実測は README
    mem_limit: ${EMBED_MEM_LIMIT:-2g}

  # ---- ここから下は退避（profile `ollama`。docker compose up では上がらない）。戻すときだけ使う ----
  ollama:
    profiles: [ollama]
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.5}
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - models:/root/.ollama    # 落としたモデル（ollama_models）。embed も読み取り専用で使う
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}

  # MCP の橋渡し（ollama-mcp-server + mcp-proxy、127.0.0.1:11435/mcp）。ollama の API を叩くので、ollama と一緒に退避
  mcp:
    profiles: [ollama]
    image: oven/bun:${BUN_VERSION:-1.4.3-alpine}
    container_name: ollama-mcp
    restart: unless-stopped
    depends_on: [ollama]
    ports:
      - "127.0.0.1:${OLLAMA_MCP_PORT:-11435}:8080"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["bunx", "mcp-proxy@${MCP_PROXY_VERSION:-6.7.20}", "--host", "0.0.0.0", "--port", "8080", "--server", "stream", "--",
              "bunx", "--bun", "ollama-mcp-server@${OLLAMA_MCP_VERSION:-1.1.0}"]
    volumes:
      - bun_cache:/root/.bun
    mem_limit: ${OLLAMA_MCP_MEM_LIMIT:-512m}

networks:
  default:
    # 固定名。ほかのプロジェクトから `external: true` で参照する
    name: ollama

volumes:
  models:
  bun_cache:
